<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StartTap - Buscar Placa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f0f11; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 20px; width: 100%; max-width: 380px; padding: 32px 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .brand-logo { font-size: 22px; font-weight: 800; letter-spacing: 1.5px; color: #ffffff; margin-bottom: 12px; text-transform: uppercase; }
    p { font-size: 14px; color: #a1a1aa; margin-bottom: 24px; line-height: 1.4; }
    
    input[type="number"] {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      text-align: center;
      border-radius: 12px;
      border: 1px solid #3f3f46;
      background-color: #27272a;
      color: #ffffff;
      outline: none;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }
    input[type="number"]:focus { border-color: #ffffff; }

    .btn-search {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background-color: #ffffff;
      color: #0f0f11;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .btn-search:active { transform: scale(0.98); }
    .footer { margin-top: 24px; font-size: 11px; color: #52525b; }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-logo">STARTTAP NFC</div>
    <p>Ingresa el número de placa impreso en el soporte para ver la información del local:</p>

    <form onsubmit="redirectPlaca(event)">
      <input type="number" id="placaInput" placeholder="Ej: 020" required min="1" max="999">
      <button type="submit" class="btn-search">Ver Información</button>
    </form>

    <div class="footer">Powered by StartTap</div>
  </div>

  <script>
    function redirectPlaca(e) {
      e.preventDefault();
      let num = document.getElementById('placaInput').value.trim();
      
      // Formatear el número a 3 dígitos (ej: "20" pasa a ser "020")
      if (num.length < 3) {
        num = num.padStart(3, '0');
      }

      // Redirigir a la página dinámica existente
      window.location.href = `https://jhossiandre.github.io/Startap/p/?id=${num}`;
    }
  </script>
</body>
</html>
