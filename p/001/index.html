<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StartTap NFC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f0f11; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 20px; width: 100%; max-width: 380px; padding: 28px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .brand-logo { font-size: 22px; font-weight: 800; letter-spacing: 1.5px; color: #ffffff; margin-bottom: 24px; text-transform: uppercase; }
    
    .btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 15px; transition: transform 0.1s ease; }
    .btn:active { transform: scale(0.98); }
    .btn svg { width: 22px; height: 22px; flex-shrink: 0; }
    
    /* Botones principales */
    .btn-google { background-color: #ffffff; color: #1f1f1f; }
    .btn-whatsapp { background-color: #25D366; color: #ffffff; }
    .btn-vcf { background-color: #27272a; color: #ffffff; border: 1px solid #3f3f46; }
    
    /* Botones de Redes Sociales con sus marcas de color */
    .btn-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: #ffffff; }
    .btn-tiktok { background-color: #000000; color: #ffffff; border: 1px solid #27272a; }
    
    .divider { font-size: 12px; color: #71717a; text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 14px 0; }
    .footer { margin-top: 20px; font-size: 11px; color: #52525b; letter-spacing: 0.5px; }
  </style>
</head>
